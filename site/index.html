<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agro-VPD Monitor — Accesso Riservato</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #f1f5f9 0%, #e2e8f0 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .gate-card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }
    .gate-logo {
      max-width: 150px;
      height: auto;
      margin-bottom: 20px;
    }
    .gate-badge {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #0f172a;
    }
    p {
      font-size: 0.92rem;
      line-height: 1.55;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="gate-card">
    <img src="./icons/logo.png" alt="Logo" class="gate-logo" onerror="this.style.display='none'">
    <div class="gate-badge">Piattaforma Agrometeorologica B2B</div>
    <h1>Agro-VPD Monitor</h1>
    <p>L'accesso al servizio di supporto decisionale irriguo avviene esclusivamente tramite il <strong>link personale univoco</strong> fornito dal tuo tecnico di riferimento.</p>
  </div>
</body>
</html>
